# New-registration defaults only; this does not change the live stately-github app.
# Installation lifecycle/access-change deliveries are automatic.
name: Stately
url: https://stately.ai
description: Private XState topology previews and managed documentation drafts
default_events:
  - pull_request
  - push
default_permissions:
  contents: read
  metadata: read
  pull_requests: write
